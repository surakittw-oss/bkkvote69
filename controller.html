<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000; --bg1:#0c0d0e; --bg2:#141517; --bg3:#1c1d1f;
  --line:#2a2b2d; --line2:#1d1e20;
  --t1:#fff; --t2:#c9cace; --t3:#8a8b90; --t4:#5b5c61;
  --brand:#00a84f; --brand-l:#00e676; --brand-rgb:0,168,79;
  --r:10px;
}
html{scroll-behavior:smooth}
body{font-family:'Kanit',system-ui,sans-serif;background:var(--bg);color:var(--t2);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:
  radial-gradient(820px 460px at 50% -8%,rgba(var(--brand-rgb),.20),transparent 70%),
  radial-gradient(620px 420px at 90% 8%,rgba(var(--brand-rgb),.08),transparent 70%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:26px 26px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 60%);mask-image:linear-gradient(180deg,#000,transparent 60%)}

#ctrl-panel{min-height:100vh;padding:26px 22px 60px;max-width:860px;margin:0 auto}
.cp-head{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.cp-logo{height:42px;width:auto}
.cp-title{font-size:20px;font-weight:800;color:#fff;letter-spacing:.3px}
.cp-title small{display:block;font-size:12px;font-weight:600;color:var(--t3);letter-spacing:.5px;margin-top:2px}
.cp-user{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:13px;color:var(--t2)}
.cp-user img{width:28px;height:28px;border-radius:50%}
.cp-signout{padding:5px 12px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--t3);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.cp-signout:hover{color:#fff;border-color:var(--t2)}
.cp-gate{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:60vh;text-align:center}
.cp-gate h2{font-size:18px;font-weight:700;color:#fff}
.cp-gate p{font-size:13px;color:var(--t3);max-width:320px;line-height:1.6}
.cp-onair{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);margin-bottom:22px}
.cp-onair-dot{width:13px;height:13px;border-radius:50%;background:#444;flex-shrink:0;transition:.2s}
.cp-onair.live .cp-onair-dot{background:#ff3b30;box-shadow:0 0 0 0 rgba(255,59,48,.6);animation:cpPulse 1.4s infinite}
@keyframes cpPulse{0%{box-shadow:0 0 0 0 rgba(255,59,48,.6)}70%{box-shadow:0 0 0 9px rgba(255,59,48,0)}100%{box-shadow:0 0 0 0 rgba(255,59,48,0)}}
.cp-onair-txt{font-size:14px;font-weight:700;color:#fff}
.cp-onair-txt small{display:block;font-size:11px;font-weight:600;color:var(--t3);margin-top:2px;letter-spacing:.3px}
.cp-onair .cp-conn{margin-left:auto;font-size:11px;font-weight:600;color:var(--t3)}
.cp-sec{margin-bottom:24px}
.cp-sec-lbl{font-size:12px;font-weight:700;color:var(--t3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}
.cp-scenes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.cp-scene{display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 10px;border-radius:11px;background:var(--bg2);border:1.5px solid var(--line);color:var(--t2);cursor:pointer;transition:.15s;font-family:inherit}
.cp-scene:hover{border-color:var(--t3);color:#fff}
.cp-scene.on{border-color:var(--brand);background:rgba(var(--brand-rgb),.14);color:#fff}
.cp-scene svg{width:30px;height:22px;opacity:.85}
.cp-scene b{font-size:13px;font-weight:700}
.cp-scene.off.on{border-color:#ff3b30;background:rgba(255,59,48,.12)}
.cp-sub{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-radius:11px;background:var(--bg2);border:1px solid var(--line)}
.cp-sub-lbl{font-size:13px;font-weight:700;color:var(--t2);margin-right:4px}
.cp-btn{padding:9px 16px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--t2);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.cp-btn:hover{border-color:var(--t3);color:#fff}
.cp-btn.on{border-color:var(--brand);background:var(--brand);color:#fff}
.cp-btn svg{width:14px;height:14px}
.cp-hint{font-size:12px;color:var(--t4);line-height:1.7;margin-top:20px;padding:13px 16px;border-radius:10px;background:rgba(255,255,255,.03);border:1px dashed var(--line)}
.cp-hint code{background:rgba(var(--brand-rgb),.16);color:var(--brand-l);padding:2px 7px;border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:11px}
.cp-hint b{color:var(--t2)}
.cp-preview-wrap{position:relative;width:100%;overflow:hidden;border-radius:10px;border:1px solid var(--line);background:#000}
.cp-preview-wrap iframe{border:none;display:block;transform-origin:top left;pointer-events:none}
.cp-preview-badge{position:absolute;top:8px;left:10px;font-size:10px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:.8px;text-transform:uppercase;pointer-events:none;z-index:2;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:5px}
/* ── Studio Mode: Preview / Program panes ── */
.cp-pp{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
@media(max-width:640px){.cp-pp{grid-template-columns:1fr}}
.cp-pane{display:flex;flex-direction:column;gap:8px}
.cp-pane-lbl{font-size:12px;font-weight:800;letter-spacing:.6px;display:flex;align-items:center;gap:7px}
.cp-pane-lbl small{font-weight:600;color:var(--t4);letter-spacing:0}
.cp-pane-lbl::before{content:"";width:9px;height:9px;border-radius:50%}
.cp-pane-lbl.pvw{color:#ffd60a}.cp-pane-lbl.pvw::before{background:#ffd60a}
.cp-pane-lbl.pgm{color:#ff3b30}.cp-pane-lbl.pgm::before{background:#ff3b30;box-shadow:0 0 0 0 rgba(255,59,48,.6);animation:cpPulse 1.4s infinite}
.cp-pane .cp-preview-wrap{border-width:2px}
.cp-global{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.cp-take{flex:1;min-width:160px;padding:13px 18px;border-radius:10px;border:none;background:var(--brand);color:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;letter-spacing:.3px}
.cp-take:hover{background:var(--brand-l);color:#04130a}
.cp-take.disabled{background:var(--bg3);color:var(--t4);cursor:default;border:1px solid var(--line)}
.cp-take-all{background:#ffd60a;color:#1a1500}
.cp-take-all:hover{background:#ffe34d}
.cp-cut{flex:1;min-width:120px;padding:13px 18px;border-radius:10px;border:1.5px solid #ff3b30;background:transparent;color:#ff6b60;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s}
.cp-cut:hover{background:#ff3b30;color:#fff}
.cp-layer{padding:16px 16px 18px;border-radius:13px;background:var(--bg2);border:1px solid var(--line);margin-bottom:16px;transition:border-color .2s}
.cp-layer.on{border-color:rgba(255,59,48,.45)}
.cp-layer-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:6px}
.cp-layer-name{font-size:14px;font-weight:800;color:#fff;letter-spacing:.2px}
.cp-layer-pgm{font-size:11px;font-weight:700;color:var(--t4)}
.cp-layer-pgm.air{color:#ff6b60}
.cp-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px;margin-bottom:12px}
.cp-opt{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:13px 8px;border-radius:10px;background:var(--bg);border:1.5px solid var(--line);color:var(--t2);cursor:pointer;transition:.15s;font-family:inherit}
.cp-opt:hover{border-color:var(--t3);color:#fff}
.cp-opt svg{width:28px;height:20px;opacity:.85}
.cp-opt b{font-size:12px;font-weight:700}
.cp-opt.pvw{border-color:#ffd60a;background:rgba(255,214,10,.12);color:#fff}
.cp-opt.pgm{box-shadow:inset 0 0 0 1.5px rgba(255,59,48,.5)}
.cp-opt-air{position:absolute;top:5px;right:5px;font-size:8px;font-weight:800;color:#fff;background:#ff3b30;padding:1px 5px;border-radius:4px;letter-spacing:.4px}
.cp-layer .cp-take{width:100%;flex:none;margin-top:2px}
.cp-layer .cp-sub{margin-top:12px}
</style>
</head>
<body>
<div id="ctrl-panel"></div>
<script>
/* ── CONFIG — แก้ตรงนี้ถ้า deploy ต่าง domain ── */
const OVERLAY_URL='https://bkkvote69.vercel.app/?overlay=live';

/* ── Firebase ── */
const firebaseConfig={apiKey:"AIzaSyBZrGgrbCSycCe46TZyXtG1boJMYWcAN-o",authDomain:"bkk-election-vote.firebaseapp.com",databaseURL:"https://bkk-election-vote-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"bkk-election-vote",storageBucket:"bkk-election-vote.firebasestorage.app",messagingSenderId:"1020264986175",appId:"1:1020264986175:web:3ee5c3cd1d93f16c882a8a"};
let fbApp=null,fbDb=null,fbAuth=null,fbUser=null,fbReady=false,fbLoading=false;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function ensureFirebase(){
  if(fbReady||fbLoading)return fbReady;
  fbLoading=true;
  try{
    if(typeof firebase==='undefined'){
      await loadScript('https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js');
    }
    fbApp=firebase.initializeApp(firebaseConfig);
    fbDb=firebase.database();
    fbAuth=firebase.auth();
    fbAuth.onAuthStateChanged(u=>{fbUser=u;});
    fbReady=true;
    if(gPendingIdToken)gFirebaseSignIn(gPendingIdToken);
    fbDb.ref('.info/connected').on('value',s=>{
      const c=s.val()===true;
      if(c)ctrlSetupListener();
      renderControlPanel();
    });
  }catch(e){fbLoading=false;return false;}
  fbLoading=false;return true;
}

/* ── Google Auth ── */
const GAUTH_CID='854069548103-4eunku0blt0po8nqe4diu8p0v0uubdn8.apps.googleusercontent.com';
let gUser=null,gPendingIdToken=null;
function gDecodeJWT(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));}catch(e){return null;}}
function gHandleCredential(resp){
  const p=gDecodeJWT(resp.credential);
  if(!p){alert('ไม่สามารถยืนยันตัวตนได้');return;}
  if(p.hd!=='thestandard.co'&&!(p.email||'').endsWith('@thestandard.co')){
    alert('⛔ ไม่มีสิทธิ์เข้าถึง\n\n'+p.email+'\nเฉพาะ @thestandard.co เท่านั้น');
    return;
  }
  gUser={name:p.name,email:p.email,picture:p.picture||''};
  try{sessionStorage.setItem('bkk69_gauth',JSON.stringify(gUser));}catch(e){}
  gFirebaseSignIn(resp.credential);
  renderControlPanel();
}
// เอา Google ID token ไปยืนยันกับ Firebase Auth → ปลดล็อกสิทธิ์ write ตาม rules
async function gFirebaseSignIn(idToken){
  gPendingIdToken=idToken;
  try{
    if(!fbReady)await ensureFirebase();
    if(!fbAuth)return;
    const cred=firebase.auth.GoogleAuthProvider.credential(idToken);
    await fbAuth.signInWithCredential(cred);
    gPendingIdToken=null;
  }catch(e){
    console.error('Firebase auth failed:',e);
    alert('เชื่อมต่อสิทธิ์ Firebase ไม่สำเร็จ\n'+e.code+': '+e.message+'\n\n(ตรวจสอบ Whitelist Client ID ใน Firebase Console)');
  }
}
function gSignOut(){
  gUser=null;gPendingIdToken=null;
  try{sessionStorage.removeItem('bkk69_gauth');}catch(e){}
  try{if(fbAuth)fbAuth.signOut();}catch(e){}
  renderControlPanel();
}

/* ── Controller state (เลเยอร์ footer/side/full แยกอิสระ) ── */
const CTRL_REF='overlay/control';
const CTRL_DEFAULT={footer:'off',side:'off',full:'off',barView:0,barPlaying:false,sideIdx:0,sidePlaying:false};
let ctrlState=Object.assign({},CTRL_DEFAULT);          // program (on air)
let pvwState={footer:'off',side:'off',full:'off'};     // preview (staged)
const PVW_URL=OVERLAY_URL+(OVERLAY_URL.indexOf('?')>=0?'&':'?')+'pvw=1';
const CP_ICONS={
  off:'<svg viewBox="0 0 32 22" fill="none"><circle cx="16" cy="11" r="6.5" stroke="currentColor" stroke-width="2"/><path d="M16 3.5v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  lower3:'<svg viewBox="0 0 32 22" fill="none"><rect x="1" y="1" width="30" height="20" rx="2.5" stroke="currentColor" stroke-width="1.4" opacity=".4"/><rect x="3.5" y="14.5" width="25" height="4.5" rx="1.2" fill="currentColor"/></svg>',
  bottombar:'<svg viewBox="0 0 32 22" fill="none"><rect x="1" y="1" width="30" height="20" rx="2.5" stroke="currentColor" stroke-width="1.4" opacity=".4"/><rect x="6.5" y="14.5" width="19" height="4.5" rx="1.2" fill="currentColor"/></svg>',
  on:'<svg viewBox="0 0 32 22" fill="none"><rect x="1" y="1" width="30" height="20" rx="2.5" stroke="currentColor" stroke-width="1.4" opacity=".4"/><rect x="20.5" y="3.5" width="8" height="15" rx="1.2" fill="currentColor"/></svg>',
  totals:'<svg viewBox="0 0 32 22" fill="none"><rect x="5" y="4" width="22" height="3" rx="1.5" fill="currentColor"/><rect x="5" y="10" width="22" height="3" rx="1.5" fill="currentColor" opacity=".7"/><rect x="5" y="16" width="14" height="3" rx="1.5" fill="currentColor" opacity=".5"/></svg>',
  map:'<svg viewBox="0 0 32 22" fill="none"><g fill="currentColor"><rect x="5" y="4" width="6" height="6" rx="1.4"/><rect x="13" y="4" width="6" height="6" rx="1.4" opacity=".6"/><rect x="21" y="4" width="6" height="6" rx="1.4"/><rect x="5" y="12" width="6" height="6" rx="1.4" opacity=".6"/><rect x="13" y="12" width="6" height="6" rx="1.4"/><rect x="21" y="12" width="6" height="6" rx="1.4" opacity=".6"/></g></svg>',
  bubble:'<svg viewBox="0 0 32 22" fill="none"><g fill="currentColor"><circle cx="9" cy="8" r="4.5"/><circle cx="20" cy="7" r="3" opacity=".6"/><circle cx="16" cy="15" r="3.5"/><circle cx="25" cy="14" r="2.5" opacity=".6"/></g></svg>',
  stat:'<svg viewBox="0 0 32 22" fill="none"><rect x="3" y="14" width="5" height="6" rx="1" fill="currentColor"/><rect x="10" y="9" width="5" height="11" rx="1" fill="currentColor" opacity=".8"/><rect x="17" y="5" width="5" height="15" rx="1" fill="currentColor" opacity=".6"/><rect x="24" y="2" width="5" height="18" rx="1" fill="currentColor" opacity=".4"/></svg>',
};
const CP_LAYERS=[
  {key:'footer',label:'Footer · กราฟิกล่าง',options:[{k:'off',label:'ปิด'},{k:'lower3',label:'Lower Third'},{k:'bottombar',label:'Bottom Bar'},{k:'stat',label:'สถิติการนับ'}]},
  {key:'side',label:'Side Panel · แผงข้าง',options:[{k:'off',label:'ปิด'},{k:'on',label:'เปิดแผงข้าง'}]},
  {key:'full',label:'Fullscreen · เต็มจอ',options:[{k:'off',label:'ปิด'},{k:'totals',label:'คะแนนรวม'},{k:'map',label:'แผนที่ผู้ชนะ'},{k:'bubble',label:'บับเบิล'}]},
];
function cpLabel(layer,val){const L=CP_LAYERS.find(x=>x.key===layer);const o=L&&L.options.find(x=>x.k===val);return o?o.label:'ปิด';}

async function ctrlWrite(patch){
  Object.assign(ctrlState,patch);
  renderControlPanel();
  try{if(!fbReady)await ensureFirebase();await fbDb.ref(CTRL_REF).update(patch);}
  catch(e){alert('สั่งงานไม่สำเร็จ: '+e.message);}
}
function cpStage(layer,val){pvwState[layer]=val;renderControlPanel();cpPushPreview();}
function cpTake(layer){ctrlWrite({[layer]:pvwState[layer]});}
function cpTakeAll(){ctrlWrite({footer:pvwState.footer,side:pvwState.side,full:pvwState.full});}
function cpCutAll(){pvwState={footer:'off',side:'off',full:'off'};ctrlWrite({footer:'off',side:'off',full:'off'});}
function ctrlBarView(v){ctrlWrite({barView:v,barPlaying:false});}
function ctrlBarAuto(){ctrlWrite({barPlaying:!ctrlState.barPlaying});}
function ctrlSideStep(d){ctrlWrite({sideIdx:(ctrlState.sideIdx||0)+d,sidePlaying:false});}
function ctrlSideAuto(){ctrlWrite({sidePlaying:!ctrlState.sidePlaying});}

function ctrlSetupListener(){
  if(!fbDb)return;
  fbDb.ref(CTRL_REF).on('value',snap=>{
    ctrlState=Object.assign({},CTRL_DEFAULT,snap.val()||{});
    renderControlPanel();cpPushPreview();
  });
}

/* ── UI ── */
function cpScalePreview(){
  document.querySelectorAll('.cp-preview-wrap').forEach(wrap=>{
    const frame=wrap.querySelector('iframe');if(!frame)return;
    const W=1280,H=720,scale=wrap.offsetWidth/W;
    frame.style.width=W+'px';frame.style.height=H+'px';
    frame.style.transform='scale('+scale+')';
    wrap.style.height=(H*scale)+'px';
  });
}
function cpPushPreview(){
  const f=document.getElementById('cp-pvw-frame');
  if(f&&f.contentWindow){try{f.contentWindow.postMessage({type:'bkk-pvw',state:Object.assign({},ctrlState,pvwState)},'*');}catch(e){}}
}

function renderControlPanel(){
  const el=document.getElementById('ctrl-panel');if(!el)return;
  const isAdmin=!!(gUser&&(gUser.email||'').endsWith('@thestandard.co'));
  if(!isAdmin){
    el.innerHTML=`<div class="cp-gate">
      <img class="cp-logo" src="logo-bkk-election-2569.webp" onerror="this.style.display='none'">
      <h2>แผงควบคุมออกอากาศ</h2>
      <p>เข้าสู่ระบบด้วยบัญชี <b>@thestandard.co</b> เพื่อสั่งงาน overlay</p>
      <div id="cp_signin"></div>
    </div>`;
    cpRenderSignin();
    return;
  }
  const s=ctrlState;
  const anyLive=s.footer!=='off'||s.side!=='off'||s.full!=='off';
  const onairTxt=[s.footer!=='off'?'Footer: '+cpLabel('footer',s.footer):'',s.side!=='off'?'Side: '+cpLabel('side',s.side):'',s.full!=='off'?'Full: '+cpLabel('full',s.full):''].filter(Boolean).join(' · ')||'ไม่มีอะไรออกอากาศ';
  const conn=fbReady?'● เชื่อมต่อแล้ว':'○ กำลังเชื่อมต่อ…';
  const layers=CP_LAYERS.map(L=>{
    const pgm=s[L.key],pvw=pvwState[L.key],dirty=pgm!==pvw;
    const opts=L.options.map(o=>{
      const isPvw=pvw===o.k,isPgm=pgm===o.k;
      return `<button class="cp-opt${isPvw?' pvw':''}${isPgm?' pgm':''}" onclick="cpStage('${L.key}','${o.k}')">${CP_ICONS[o.k]||''}<b>${o.label}</b>${isPgm?'<span class="cp-opt-air">ON AIR</span>':''}</button>`;
    }).join('');
    let sub='';
    if(L.key==='footer'&&pgm==='bottombar'){
      sub=`<div class="cp-sub"><span class="cp-sub-lbl">วิว Bottom Bar:</span>
        <button class="cp-btn ${!s.barPlaying&&s.barView===0?'on':''}" onclick="ctrlBarView(0)">ผู้ว่าฯ</button>
        <button class="cp-btn ${!s.barPlaying&&s.barView===1?'on':''}" onclick="ctrlBarView(1)">ส.ก.</button>
        <button class="cp-btn ${s.barPlaying?'on':''}" onclick="ctrlBarAuto()">${s.barPlaying?'⏸ หยุด':'▶ สลับอัตโนมัติ'}</button></div>`;
    }else if(L.key==='side'&&pgm==='on'){
      sub=`<div class="cp-sub"><span class="cp-sub-lbl">เลื่อน Side:</span>
        <button class="cp-btn" onclick="ctrlSideStep(-1)">◀</button>
        <button class="cp-btn" onclick="ctrlSideStep(1)">▶</button>
        <button class="cp-btn ${s.sidePlaying?'on':''}" onclick="ctrlSideAuto()">${s.sidePlaying?'⏸ หยุด':'▶ สลับอัตโนมัติ'}</button></div>`;
    }
    return `<div class="cp-layer${pgm!=='off'?' on':''}">
      <div class="cp-layer-hd"><span class="cp-layer-name">${L.label}</span>
        <span class="cp-layer-pgm${pgm!=='off'?' air':''}">${pgm!=='off'?'● ออกอากาศ: '+cpLabel(L.key,pgm):'○ ปิดอยู่'}</span></div>
      <div class="cp-opts">${opts}</div>
      <button class="cp-take${dirty?'':' disabled'}" ${dirty?'':'disabled'} onclick="cpTake('${L.key}')">TAKE ▶ ${cpLabel(L.key,pvw)}</button>
      ${sub}</div>`;
  }).join('');
  el.innerHTML=`
    <div class="cp-head">
      <img class="cp-logo" src="logo-bkk-election-2569.webp" onerror="this.style.display='none'">
      <div class="cp-title">แผงควบคุมออกอากาศ<small>BKK VOTE 69 · BROADCAST CONTROLLER</small></div>
      <div class="cp-user">${gUser.picture?`<img src="${gUser.picture}" onerror="this.style.display='none'">`:''}<span>${gUser.name}</span><button class="cp-signout" onclick="gSignOut()">ออกจากระบบ</button></div>
    </div>
    <div class="cp-onair ${anyLive?'live':''}">
      <span class="cp-onair-dot"></span>
      <div class="cp-onair-txt">${anyLive?'ON AIR':'OFF AIR'}<small>${onairTxt}</small></div>
      <span class="cp-conn">${conn}</span>
    </div>
    <div class="cp-pane">
      <div class="cp-pane-lbl pvw">PREVIEW <small>· ภาพที่จัดไว้ ยังไม่ออกอากาศ จนกว่าจะกด TAKE</small></div>
      <div class="cp-preview-wrap"><iframe id="cp-pvw-frame" src="${PVW_URL}" scrolling="no" allowtransparency="true" onload="cpPushPreview()"></iframe></div>
    </div>
    <div class="cp-global">
      <button class="cp-take cp-take-all" onclick="cpTakeAll()">TAKE ทั้งหมด ▶</button>
      <button class="cp-cut" onclick="cpCutAll()">CUT · ปิดทั้งหมด</button>
    </div>
    ${layers}
    <div class="cp-hint">เปิด overlay ใน OBS / vMix ที่ <code>${OVERLAY_URL}</code> · เลือก scene = ขึ้น <b>PREVIEW</b> ก่อน → กด <b>TAKE</b> ถึงออกอากาศ · 3 เลเยอร์ (Footer / Side / Fullscreen) แยกกันอิสระ ขึ้นพร้อมกันได้</div>`;
  cpScalePreview();
}

function cpRenderSignin(){
  if(!window.google||!google.accounts){setTimeout(cpRenderSignin,400);return;}
  const t=document.getElementById('cp_signin');if(!t)return;
  google.accounts.id.initialize({client_id:GAUTH_CID,callback:r=>{gHandleCredential(r);},ux_mode:'popup'});
  google.accounts.id.renderButton(t,{type:'standard',shape:'pill',theme:'filled_black',size:'large',text:'signin_with',locale:'th'});
}

/* ── Init ── */
try{const s=sessionStorage.getItem('bkk69_gauth');if(s)gUser=JSON.parse(s);}catch(e){}
renderControlPanel();
setTimeout(()=>ensureFirebase(),400);
let _rt;addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(cpScalePreview,120)});
</script>
</body>
</html>
